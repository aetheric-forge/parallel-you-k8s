apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parallel-you
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/aetheric-forge/parallel-you-k8s.git
    targetRevision: main
    path: overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: aetheric-forge
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
