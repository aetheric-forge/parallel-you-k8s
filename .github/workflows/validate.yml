name: Validate manifests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render manifests
        run: |
          kubectl kustomize base > /dev/null
          kubectl kustomize overlays/dev > /dev/null
          kubectl kustomize overlays/prod > /dev/null
