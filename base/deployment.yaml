apiVersion: apps/v1
kind: Deployment
metadata:
  name: parallel-you
  namespace: aetheric-forge
spec:
  replicas: 1
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 180
  minReadySeconds: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: parallel-you
  template:
    metadata:
      annotations:
        aetheric-forge/consumer-revision: 9d348db0b8b71fbfe2c979189fdf346bc98a7bf46bf6bd01aeb5fe4f24bc0350
      labels:
        app.kubernetes.io/name: parallel-you
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      serviceAccountName: parallel-you
      imagePullSecrets: []
      securityContext:
        runAsNonRoot: true
        runAsUser: 1654
        runAsGroup: 1654
        fsGroup: 1654
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: parallel-you
          image: ghcr.io/aetheric-forge/parallel-you:sha-9c83e03@sha256:b8f81991ec0adb278320fe9365aa934a152ae5e69415732c3164eb251636c755
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: SSL_CERT_FILE
              value: /var/run/aetheric-forge/trust/ca.crt
            - name: ParallelYou__ProvisionedConfigurationPath
              value: /var/run/aetheric-forge/parallel-you/configuration.json
            - name: ParallelYou__DeploymentId
              value: f7448b244efacc5bf6b2decc4a7b0879eeb971dbf87e79657eb6735e9445318e
            - name: ParallelYou__Environment
              value: production
            - name: ParallelYou__PlanId
              value: 41926c2300f105b25f5d66e77c33a920ae58ed0fa177485ddb5a867f170ffe2a
            - name: ParallelYou__ProtectionKeyDirectory
              value: /data/keys
          startupProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 30
            periodSeconds: 2
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            failureThreshold: 3
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            failureThreshold: 3
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
          volumeMounts:
            - name: data-protection-keys
              mountPath: /data/keys
            - name: parallel-you-consumer
              mountPath: /var/run/aetheric-forge/parallel-you
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: step-ca-root-ca
              mountPath: /var/run/aetheric-forge/trust
              readOnly: true
      volumes:
        - name: parallel-you-consumer
          secret:
            secretName: parallel-you-consumer
            items:
              - key: configuration.json
                path: configuration.json
        - name: data-protection-keys
          persistentVolumeClaim:
            claimName: parallel-you-data-protection
        - name: tmp
          emptyDir:
            sizeLimit: 128Mi
        - name: step-ca-root-ca
          configMap:
            name: step-ca-root-ca
            items:
              - key: ca.crt
                path: ca.crt
